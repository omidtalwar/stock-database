<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a87ed"/>
      <stop offset="100%" stop-color="#003e92"/>
    </linearGradient>
    <linearGradient id="roll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cce0f8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Cloth bolt body -->
  <rect x="14" y="24" width="72" height="28" rx="2" fill="url(#roll)"/>

  <!-- Left end cap (depth illusion) -->
  <ellipse cx="14" cy="38" rx="9"   ry="14"  fill="#ddeeff"/>
  <ellipse cx="14" cy="38" rx="5.5" ry="8.5" fill="#b8d4f0"/>
  <ellipse cx="14" cy="38" rx="2.2" ry="3.5" fill="#0067C0"/>

  <!-- Right end cap -->
  <ellipse cx="86" cy="38" rx="9"   ry="14"  fill="#ccd8ec"/>
  <ellipse cx="86" cy="38" rx="5.5" ry="8.5" fill="#a8c4e0"/>
  <ellipse cx="86" cy="38" rx="2.2" ry="3.5" fill="#003580"/>

  <!-- Fabric layer lines on body -->
  <line x1="14" y1="30" x2="86" y2="30" stroke="#0060b0" stroke-width="0.8" opacity="0.12"/>
  <line x1="14" y1="34" x2="86" y2="34" stroke="#0060b0" stroke-width="0.8" opacity="0.12"/>
  <line x1="14" y1="38" x2="86" y2="38" stroke="#0060b0" stroke-width="0.8" opacity="0.12"/>
  <line x1="14" y1="42" x2="86" y2="42" stroke="#0060b0" stroke-width="0.8" opacity="0.12"/>
  <line x1="14" y1="46" x2="86" y2="46" stroke="#0060b0" stroke-width="0.8" opacity="0.12"/>

  <!-- FZL brand text -->
  <text x="50" y="86" text-anchor="middle" fill="white"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="27" font-weight="900" letter-spacing="4">FZL</text>
</svg>
